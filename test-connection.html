<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zheoa — Connection Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fdfdfc;
      color: #1a1a2e;
      padding: 40px 20px;
      max-width: 720px;
      margin: 0 auto;
      line-height: 1.6;
    }
    h1 { font-weight: 800; margin-bottom: 16px; }
    .status {
      padding: 16px 20px;
      border-radius: 12px;
      margin: 20px 0;
      font-weight: 600;
    }
    .status.ok    { background: #e8f5e9; color: #2e7d32; border-left: 4px solid #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; border-left: 4px solid #c62828; }
    .status.wait  { background: #fff8e1; color: #b39b00; border-left: 4px solid #ffdb10; }
    code {
      background: #f0f2f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    pre {
      background: #0d1c26;
      color: #b0c4d0;
      padding: 16px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 0.85em;
    }
  </style>
</head>
<body>

  <h1>Zheoa — Supabase Connection Test</h1>

  <div id="status" class="status wait">
    ⏳ Loading config and Supabase client…
  </div>

  <div id="details"></div>

  <!-- 1. Load config.js -->
  <script src="config.js"></script>

  <!-- 2. Load Supabase JS client from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ============================================================
    // TEST SCRIPT
    // ============================================================
    (async function runTest() {
      const statusEl = document.getElementById('status');
      const detailsEl = document.getElementById('details');

      try {
        // 1. Check config exists
        const config = window.ZHEOA_CONFIG || {};
        if (!config.SUPABASE_URL || !config.SUPABASE_ANON_KEY) {
          statusEl.className = 'status error';
          statusEl.textContent = '❌ config.js is missing SUPABASE_URL or SUPABASE_ANON_KEY';
          return;
        }

        // 2. Init Supabase client
        const supabase = window.supabase.createClient(
          config.SUPABASE_URL,
          config.SUPABASE_ANON_KEY
        );

        // 3. Try a lightweight call — fetch auth session (always works)
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) throw error;

        // 4. Success
        statusEl.className = 'status ok';
        statusEl.textContent = '✅ Supabase connection successful';

        detailsEl.innerHTML = `
          <p><strong>Project URL:</strong> <code>${config.SUPABASE_URL}</code></p>
          <p><strong>Anon key (masked):</strong> <code>${config.SUPABASE_ANON_KEY.slice(0, 12)}…${config.SUPABASE_ANON_KEY.slice(-6)}</code></p>
          <p><strong>Auth session:</strong> ${session ? 'Active' : 'None (expected — no tables yet)'}</p>
          <p>You are ready for <strong>Step 2 — Core Schema</strong>.</p>
        `;

      } catch (err) {
        statusEl.className = 'status error';
        statusEl.textContent = '❌ Connection failed — see details below';
        detailsEl.innerHTML = `<pre>${err.message || JSON.stringify(err, null, 2)}</pre>`;
        console.error(err);
      }
    })();
  </script>

</body>
</html>
